name: AI Pull Request Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # For checking out the code
      pull-requests: write    # For posting review comments

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AI Pull Request Review (Claude)
        uses: diekotto/ai-pull-review@v2
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Optional but recommended (default works, but explicit is safer)

          # Focus on Godot-relevant files
          file_patterns: '**/*.gd,**/*.cs'

          # Exclude common noise (add more if needed, e.g., generated files)
          exclude_patterns: '**/node_modules/**,**/dist/**,**/export/**,**/addons/**'

          # Thorough analysis - 'deep' gives the most detailed feedback
          analysis_level: basic

          # Use a powerful model (Sonnet is excellent for code reasoning; switch to Opus if you want max quality)
          model: claude-3-5-sonnet-20241022

          # Limit to avoid huge PRs overwhelming the context
          max_files: 5

          # Lower threshold means more comments (even on moderate-confidence issues)
          comment_threshold: 0.6

# Optional: Add a custom prompt if you want even more Godot-specific guidance
#          custom_prompt: |
#            You are an expert Godot engineer reviewing GDScript and C# code.
#            Focus on: performance (e.g., _process vs signals), best practices (typed GDScript, node paths),
#            common pitfalls (null references, unnormalized vectors), and maintainability.
#            Provide specific, actionable suggestions with code examples.
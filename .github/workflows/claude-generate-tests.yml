name: Claude Generate Tests
on:
  pull_request:
    types: [opened, synchronize]  # Triggers on PR open and every new push
    paths:
      - '**.gd'  # Optional: Only run if GDScript files changed (saves cost)
      - '**.cs'  # Optional: Only run if C# files changed (saves cost)

jobs:
  claude-generate-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for git commit + push
      pull-requests: write  # For potential comments
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history needed for accurate diffs

      - name: Install Godot (for potential validation if needed)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1  # Or your Godot version, e.g., 4.4 / stable

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            This is a Godot 4 project using GDScript and the GUT testing framework.
            Tests are in res://tests/ and named test_<script_name>.gd.

            Analyze the changed .gd files in this PR.
            For each modified or new script that lacks comprehensive tests:
            - Generate high-quality GUT tests covering logic, edge cases, signals, and Godot-specific behavior.
            - Output the full test file content clearly labeled (e.g., "### Suggested tests for player.gd ###" followed by the code).

            If tests already exist and are sufficient, say "All changed scripts have good test coverage."

            Post your response as a PR comment only. Do not attempt to commit or push changes.
          claude_args: |
            --model claude-3-5-sonnet-20241022  # Or claude-3-opus-20240229 for deeper reasoning
            --max-turns 20
            --allowed-tools "Bash(git:*),Edit,Write,View,GlobTool,GrepTool"
            --show-full-output true

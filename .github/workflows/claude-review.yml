name: Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # Required for Bedrock/Vertex if used
      actions: read  # Required for CI tools
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better context
      
      - name: AI Pull Request Review
        uses: diekotto/ai-pull-review@v2
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Optional but helps with large PRs
          file_patterns: '**/*.gd,**/*.cs,**/*'  # Adjust for your Godot files (GDScript/CS)
          analysis_level: deep  # basic/standard/deep — deep for thorough logic/security
          model: claude-3-5-sonnet-20241022  # Or latest, e.g., claude-3-5-sonnet-latest
          comment_threshold: 0.5  # Lower = more comments
          max_files: 10
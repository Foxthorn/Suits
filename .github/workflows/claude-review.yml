name: Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # Required for Bedrock/Vertex if used
      actions: read  # Required for CI tools
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better context
      
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Or use OAuth: claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          # Explicit prompt activates Agent Mode
          prompt: |
            Automatically review this pull request for:
            - Logical bugs and errors
            - Security vulnerabilities (injections, hard-coded secrets, etc.)
            - Coding standards violations (naming, structure, Godot best practices)

            Use git diff to analyze changes.
            Output a detailed review in markdown.
            For each issue: file, line, explanation, and suggested fix code.
            If no major issues, say "LGTM" and approve.
            End with your full review summary.
          
          # Restrict tools for security
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github__get_pull_request,mcp__github__list_pull_request_files,mcp__github__create_issue_comment,mcp__github__create_pull_request_review"
            --max-turns 10

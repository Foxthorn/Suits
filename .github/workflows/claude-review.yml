name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the pull request changes. Focus on:
            - Logical errors or bugs
            - Security vulnerabilities (e.g., injection, auth issues, secrets exposure)
            - Adherence to coding standards (readability, naming, structure)
            Provide concise suggestions with code fixes where possible.
            Prioritize critical issues; approve if none found.